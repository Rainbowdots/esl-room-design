<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Design Your Dream Room</title>
<style>
  :root {
    --bg: #f0f4f8;
    --sidebar-bg: #ffffff;
    --room-wall: #fdf6e3;
    --room-floor: #c4a882;
    --room-border: #8d6e4a;
    --accent: #3b82f6;
    --text: #1e293b;
    --text-light: #64748b;
    --radius: 10px;
    --shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f172a;
      --sidebar-bg: #1e293b;
      --room-wall: #334155;
      --room-floor: #5c4a32;
      --room-border: #78716c;
      --accent: #60a5fa;
      --text: #e2e8f0;
      --text-light: #94a3b8;
      --shadow: 0 2px 8px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f172a;
    --sidebar-bg: #1e293b;
    --room-wall: #334155;
    --room-floor: #5c4a32;
    --room-border: #78716c;
    --accent: #60a5fa;
    --text: #e2e8f0;
    --text-light: #94a3b8;
    --shadow: 0 2px 8px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    min-height: 100%;
  }
  html, body { height: 100%; }

  h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }

  .app {
    display: flex;
    gap: 16px;
    max-width: 1060px;
    margin: 0 auto;
    padding: 16px;
    align-items: flex-start;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .sidebar-tip {
    font-size: .8rem;
    color: var(--text-light);
    margin-bottom: 12px;
    line-height: 1.4;
  }
  .item-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 8px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: .9rem;
    font-weight: 600;
    color: #fff;
    transition: filter .15s, transform .1s;
    box-shadow: 0 2px 4px rgba(0,0,0,.12);
  }
  .item-btn:hover { filter: brightness(1.08); }
  .item-btn:active { transform: scale(.97); }
  .item-btn .emoji { font-size: 1.5rem; line-height: 1; }

  .btn-bed    { background: #ec4899; }
  .btn-sofa   { background: #3b82f6; }
  .btn-plant  { background: #22c55e; }
  .btn-lamp   { background: #eab308; color: #1e293b; }
  .btn-desk   { background: #a855f7; }
  .btn-cat    { background: #f97316; }

  /* ── Room ── */
  .room-wrap {
    flex: 1;
    min-width: 0;
  }
  .room {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    max-height: 460px;
    background: var(--room-wall);
    border: 5px solid var(--room-border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: default;
    box-shadow: var(--shadow);
    touch-action: none;
  }
  .floor {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 28%;
    background: var(--room-floor);
    border-top: 2px solid var(--room-border);
  }
  .room-empty-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    color: var(--text-light);
    font-size: .95rem;
    opacity: .6;
    text-align: center;
    padding: 20px;
    z-index: 0;
  }

  /* ── Placed items ── */
  .placed {
    position: absolute;
    cursor: grab;
    user-select: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: filter .1s;
    z-index: 1;
  }
  .placed:active { cursor: grabbing; }
  .placed.dragging { filter: drop-shadow(0 4px 12px rgba(0,0,0,.25)); z-index: 999 !important; }
  .placed .icon { font-size: 48px; line-height: 1; pointer-events: none; }
  .placed .label {
    font-size: .65rem;
    color: var(--text-light);
    font-weight: 600;
    margin-top: 2px;
    pointer-events: none;
    white-space: nowrap;
    background: rgba(255,255,255,.7);
    padding: 1px 6px;
    border-radius: 4px;
  }
  .placed .delete-btn {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: none;
    background: #ef4444;
    color: #fff;
    font-size: 12px;
    line-height: 20px;
    text-align: center;
    cursor: pointer;
    display: none;
    z-index: 1000;
  }
  .placed:hover .delete-btn { display: block; }

  /* ── Right panel ── */
  .panel {
    width: 260px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .finish-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #16a34a;
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s;
    margin-top: 12px;
  }
  .finish-btn:hover { background: #15803d; }

  .clear-btn {
    width: 100%;
    padding: 8px;
    border: 2px solid #ef4444;
    border-radius: 8px;
    background: transparent;
    color: #ef4444;
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: background .15s, color .15s;
  }
  .clear-btn:hover { background: #ef4444; color: #fff; }

  /* ── Result ── */
  .result { margin-top: 16px; }
  .result-heading {
    font-size: 1rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .result-list {
    font-size: .85rem;
    line-height: 1.6;
    margin-bottom: 12px;
  }
  .result-sentence {
    background: #eff6ff;
    border-left: 3px solid var(--accent);
    padding: 8px 10px;
    border-radius: 0 6px 6px 0;
    font-size: .85rem;
    line-height: 1.55;
    margin-bottom: 6px;
    color: #1e293b;
  }
  .result-prompt {
    font-size: .8rem;
    color: var(--text-light);
    font-style: italic;
    margin-top: 10px;
  }
  .analysis-card {
    background: linear-gradient(135deg, #fdf2f8, #ede9fe);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 14px;
    text-align: center;
  }
  .analysis-type {
    font-size: 1.1rem;
    font-weight: 800;
    color: #7c3aed;
    margin-bottom: 4px;
  }
  .analysis-text {
    font-size: .82rem;
    line-height: 1.5;
    color: #4a044e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .analysis-card {
      background: linear-gradient(135deg, #3b0764, #1e1b4b);
    }
    :root:not([data-theme="light"]) .analysis-type { color: #c4b5fd; }
    :root:not([data-theme="light"]) .analysis-text { color: #e9d5ff; }
    :root:not([data-theme="light"]) .result-sentence { background: #1e293b; color: #e2e8f0; }
  }
  :root[data-theme="dark"] .analysis-card {
    background: linear-gradient(135deg, #3b0764, #1e1b4b);
  }
  :root[data-theme="dark"] .analysis-type { color: #c4b5fd; }
  :root[data-theme="dark"] .analysis-text { color: #e9d5ff; }
  :root[data-theme="dark"] .result-sentence { background: #1e293b; color: #e2e8f0; }

  /* ── Responsive ── */
  @media (max-width: 860px) {
    .app { flex-direction: column; align-items: stretch; }
    .sidebar {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .sidebar h2, .sidebar .sidebar-tip { width: 100%; }
    .item-btn { width: auto; flex: 1; min-width: 120px; margin-bottom: 0; }
    .panel { width: 100%; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>🏠 Room Designer</h2>
    <p class="sidebar-tip">Click to add furniture. Drag to move. Hover & tap ✕ to remove.</p>

    <button class="item-btn btn-bed"   onclick="addItem('bed')"><span class="emoji">🛏️</span> Pink Bed</button>
    <button class="item-btn btn-sofa"  onclick="addItem('sofa')"><span class="emoji">🛋️</span> Blue Sofa</button>
    <button class="item-btn btn-plant" onclick="addItem('plant')"><span class="emoji">🪴</span> Green Plant</button>
    <button class="item-btn btn-lamp"  onclick="addItem('lamp')"><span class="emoji">💡</span> Yellow Lamp</button>
    <button class="item-btn btn-desk"  onclick="addItem('desk')"><span class="emoji">📚</span> Study Desk</button>
    <button class="item-btn btn-cat"   onclick="addItem('cat')"><span class="emoji">🐱</span> Cute Cat</button>
  </div>

  <!-- Room -->
  <div class="room-wrap">
    <div class="room" id="room">
      <div class="floor"></div>
      <div class="room-empty-hint" id="empty-hint">Click a button on the left to start decorating!</div>
    </div>
  </div>

  <!-- Right panel -->
  <div class="panel">
    <h2>My Room</h2>
    <p style="font-size:.8rem;color:var(--text-light);margin-top:4px;">Design your dream room, then practice describing it in English!</p>
    <button class="finish-btn" onclick="finishDesign()">✨ Describe My Room</button>
    <button class="clear-btn" onclick="clearRoom()">🗑 Start Over</button>
    <div class="result" id="result"></div>
  </div>
</div>

<script>
const ITEMS = {
  bed:   { emoji: '🛏️', label: 'Pink Bed',    article: 'a' },
  sofa:  { emoji: '🛋️', label: 'Blue Sofa',   article: 'a' },
  plant: { emoji: '🪴',  label: 'Green Plant', article: 'a' },
  lamp:  { emoji: '💡',  label: 'Yellow Lamp', article: 'a' },
  desk:  { emoji: '📚',  label: 'Study Desk',  article: 'a' },
  cat:   { emoji: '🐱',  label: 'Cute Cat',    article: 'a' },
};

let placedItems = []; // { key, el }
let nextZ = 1;

function addItem(key) {
  const room = document.getElementById('room');
  const def = ITEMS[key];
  if (!def) return;

  document.getElementById('empty-hint').style.display = 'none';

  const el = document.createElement('div');
  el.className = 'placed';
  el.dataset.key = key;
  el.innerHTML = `
    <button class="delete-btn" title="Remove">✕</button>
    <span class="icon">${def.emoji}</span>
    <span class="label">${def.label}</span>
  `;

  // Place near center with slight random offset
  const rw = room.clientWidth;
  const rh = room.clientHeight;
  el.style.left = (rw / 2 - 30 + (Math.random() - 0.5) * 80) + 'px';
  el.style.top  = (rh * 0.35 + (Math.random() - 0.5) * 60) + 'px';
  el.style.zIndex = nextZ++;

  // Delete button
  el.querySelector('.delete-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    el.remove();
    placedItems = placedItems.filter(p => p.el !== el);
    if (placedItems.length === 0) {
      document.getElementById('empty-hint').style.display = 'flex';
    }
  });

  // Drag setup
  setupDrag(el, room);

  room.appendChild(el);
  placedItems.push({ key, el });
}

function setupDrag(el, room) {
  let dragging = false;
  let shiftX, shiftY;

  function onStart(e) {
    e.preventDefault();
    const ev = e.touches ? e.touches[0] : e;
    const rect = el.getBoundingClientRect();
    shiftX = ev.clientX - rect.left;
    shiftY = ev.clientY - rect.top;
    el.classList.add('dragging');
    el.style.zIndex = nextZ++;
    dragging = true;

    document.addEventListener('mousemove', onMove);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchend', onEnd);
  }

  function onMove(e) {
    if (!dragging) return;
    e.preventDefault();
    const ev = e.touches ? e.touches[0] : e;
    const roomRect = room.getBoundingClientRect();
    let left = ev.clientX - roomRect.left - shiftX;
    let top  = ev.clientY - roomRect.top - shiftY;

    // Keep inside the room
    const elW = el.offsetWidth;
    const elH = el.offsetHeight;
    left = Math.max(0, Math.min(left, room.clientWidth - elW));
    top  = Math.max(0, Math.min(top, room.clientHeight - elH));

    el.style.left = left + 'px';
    el.style.top  = top + 'px';
  }

  function onEnd() {
    dragging = false;
    el.classList.remove('dragging');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('mouseup', onEnd);
    document.removeEventListener('touchend', onEnd);
  }

  el.addEventListener('mousedown', onStart);
  el.addEventListener('touchstart', onStart, { passive: false });
}

function clearRoom() {
  placedItems.forEach(p => p.el.remove());
  placedItems = [];
  nextZ = 1;
  document.getElementById('empty-hint').style.display = 'flex';
  document.getElementById('result').innerHTML = '';
}

function getAnalysis(counts, total) {
  const has = (k) => (counts[k] || 0) > 0;
  const many = (k) => (counts[k] || 0) >= 3;
  const types = Object.keys(counts).length;

  // Check from most specific to least
  if (many('cat'))
    return ['The Crazy Cat Person 🐱🐱🐱', "You put SO many cats in your room! You don't need furniture — you need a cat café. Your room is basically a cat party!"];
  if (many('plant'))
    return ['The Jungle Creator 🌿🌿🌿', "Your room is turning into a forest! You love nature so much that your friends might need a map to find you in there."];
  if (many('lamp'))
    return ['The Disco Designer 🪩✨', "So many lights! Your room is brighter than the sun. You could have a dance party in there every night!"];
  if (total >= 8)
    return ['The Maximalist 🎪', "More is more! Your room is FULL of cool stuff. You never say no to a good idea. Your room is like a treasure box!"];
  if (types >= 5)
    return ['The Interior Designer ✨', "You picked almost everything! You have great taste and want your room to be perfect. Maybe you'll design houses someday!"];
  if (has('bed') && has('cat') && has('plant'))
    return ['The Nature Lover 🌸', "A comfy bed, a cute cat, and green plants — you want your room to feel like a peaceful garden. You're calm and kind!"];
  if (has('desk') && has('lamp') && !has('sofa'))
    return ['The Future CEO 💼', "A desk and a lamp? You're serious about studying! No sofa because you don't have time to rest — you're too busy being amazing!"];
  if (has('sofa') && has('cat'))
    return ['The Professional Relaxer 😎', "A sofa and a cat? You know the secret to a happy life: sit down, pet the cat, and chill. You're a relaxation expert!"];
  if (has('sofa') && has('lamp'))
    return ['The Movie Night Pro 🎬', "A sofa and a lamp — the perfect setup for watching movies! All you need now is popcorn. Your friends probably love coming over!"];
  if (has('desk') && has('plant'))
    return ['The Zen Student 🧘', "Studying with plants around you? Smart! Green plants help you think better. Your room is calm, quiet, and full of good vibes."];
  if (has('bed') && has('cat'))
    return ['The Cozy Dreamer 😴', "A pink bed and a cute cat? You love being warm and comfy! You probably have the best naps in the whole school."];
  if (has('bed') && has('desk'))
    return ['The Balanced Student 📖', "A bed AND a desk — you know when to study and when to sleep! You're smart about how you use your time."];
  if (has('cat') && has('desk'))
    return ['The Multitasker 🌟', "Studying with a cat nearby? That cat is your study buddy! Just don't let it sit on your homework."];
  if (has('bed') && has('sofa'))
    return ['The Comfort King 👑', "A bed AND a sofa? You have TWO places to lie down! You really, really love being comfortable. We respect that."];
  if (total === 1)
    return ['The Minimalist 🧹', "Just one thing? You like your room simple and clean. Less stuff means less mess. Smart thinking!"];
  if (has('lamp') && has('plant'))
    return ['The Warm Designer 🌻', "A lamp and a plant — you want your room to feel warm and alive. Your room probably smells nice too!"];
  if (has('cat') && !has('bed'))
    return ['The Cat Café Owner ☕', "You have a cat but no bed?! Who needs sleep when you have a furry friend? Your cat is more important than everything!"];
  return ['The Creative Decorator 🎨', "You have great ideas! Your room shows your personality — unique, creative, and full of style!"];
}

function finishDesign() {
  const result = document.getElementById('result');

  if (placedItems.length === 0) {
    result.innerHTML = '<p class="result-prompt">Add some furniture first, then come back!</p>';
    return;
  }

  // Count items
  const counts = {};
  placedItems.forEach(p => {
    counts[p.key] = (counts[p.key] || 0) + 1;
  });
  const total = placedItems.length;

  // Build item list display
  let listHTML = '';
  const entries = Object.entries(counts);
  entries.forEach(([key, count]) => {
    const def = ITEMS[key];
    const plural = count > 1 ? 's' : '';
    listHTML += `<div>${def.emoji} ${count} ${def.label}${plural}</div>`;
  });

  // Personality analysis
  const [aType, aText] = getAnalysis(counts, total);

  // Build sentences for speaking practice
  const sentences = [];

  // Sentence 1: "My room has..."
  const nameList = entries.map(([key, count]) => {
    const def = ITEMS[key];
    if (count === 1) return `${def.article} ${def.label.toLowerCase()}`;
    return `${numberWord(count)} ${def.label.toLowerCase()}s`;
  });
  sentences.push(`"My room has ${joinList(nameList)}."`);

  // Sentence 2: one item detail
  const sorted = [...entries].sort((a,b) => b[1] - a[1]);
  if (sorted.length > 0) {
    const [topKey, topCount] = sorted[0];
    const topDef = ITEMS[topKey];
    if (topCount > 1) {
      sentences.push(`"I put ${numberWord(topCount)} ${topDef.label.toLowerCase()}s in my room because I really like them!"`);
    } else {
      sentences.push(`"I put ${topDef.article} ${topDef.label.toLowerCase()} in my room because I think it's cool."`);
    }
  }

  // Sentence 3: total count
  sentences.push(`"There ${total === 1 ? 'is' : 'are'} ${numberWord(total)} thing${total > 1 ? 's' : ''} in my room."`);

  const sentenceHTML = sentences.map(s => `<div class="result-sentence">${s}</div>`).join('');

  result.innerHTML = `
    <div class="analysis-card">
      <div class="analysis-type">You are: ${aType}</div>
      <div class="analysis-text">${aText}</div>
    </div>
    <div class="result-heading">🎤 Your Room Has:</div>
    <div class="result-list">${listHTML}</div>
    <div class="result-heading">Try Saying:</div>
    ${sentenceHTML}
    <p class="result-prompt">Now make your own sentence!<br>"I like my room because ___."</p>
  `;
}

function numberWord(n) {
  const words = ['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
  return n <= 10 ? words[n] : String(n);
}

function joinList(arr) {
  if (arr.length === 1) return arr[0];
  if (arr.length === 2) return arr[0] + ' and ' + arr[1];
  return arr.slice(0, -1).join(', ') + ', and ' + arr[arr.length - 1];
}
</script>

</body>
</html>
